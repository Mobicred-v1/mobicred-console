# CI overlay only. Never select this file in Coolify.
services:
  api:
    environment:
      NODE_EXTRA_CA_CERTS: /test-ca/tls.crt
    volumes:
      - ./.compose-test/tls.crt:/test-ca/tls.crt:ro
  web:
    environment:
      NODE_EXTRA_CA_CERTS: /test-ca/tls.crt
    volumes:
      - ./.compose-test/tls.crt:/test-ca/tls.crt:ro
  fixture-edge:
    image: node:22-bookworm-slim
    working_dir: /fixtures
    command: [node, edge.cjs]
    environment:
      NODE_ENV: test
      CONSOLE_COMPOSE_TESTS: 'true'
      TEST_CLIENT_SECRET: ${CONSOLE_OIDC_CLIENT_SECRET}
    volumes:
      - ./tests/compose/edge.cjs:/fixtures/edge.cjs:ro
      - ./.compose-test/tls.crt:/fixtures/tls.crt:ro
      - ./.compose-test/tls.key:/fixtures/tls.key:ro
    ports:
      - '127.0.0.1:8443:8443'
    networks:
      default:
        aliases: [console.example.test, identity.example.test]
