name: Console database checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: console_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:fixture-only-password@localhost:5432/console_test
      CONSOLE_DATABASE_TESTS: 'true'
      CONSOLE_RUN_MIGRATIONS: 'true'
      CONSOLE_CASE_WORKFLOWS_ENABLED: 'true'
      CONSOLE_CASE_WRITE_ROLES: OPS
      CONSOLE_AUDIT_READ_ROLES: OPS,AUDIT_READER
      CONSOLE_CASE_REPORT_ROLES: OPS,AUDIT_READER
      CONSOLE_OIDC_ISSUER: https://identity.example.test/realms/staff
      CONSOLE_OIDC_CLIENT_ID: fixture-client
      CONSOLE_OIDC_CLIENT_SECRET: fixture-only-secret
      CONSOLE_OIDC_AUDIENCE: console
      CONSOLE_STAFF_ROLES: OPS,AUDIT_READER
      CONSOLE_SESSION_ENCRYPTION_KEY: 'abababababababababababababababababababababababababababababababab'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/api test --runInBand --testPathPatterns=case-workflow.integration.spec
