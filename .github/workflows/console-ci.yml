name: Console checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: console-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: API build
        run: bun run --cwd apps/api build
      - name: API tests
        run: bun run --cwd apps/api test --runInBand
      - name: Web build
        run: bun run --cwd apps/web build
      - name: Web lint
        run: bun run --cwd apps/web lint
