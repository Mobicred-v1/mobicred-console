name: Deployed console observations
on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Environment already redeployed in Coolify'
        type: choice
        required: true
        options: [staging, main]
permissions:
  contents: read
concurrency:
  group: deployed-console-${{ inputs.tier }}
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe the selected environment after manual redeploy
        env:
          DEPLOYED_TIER: ${{ inputs.tier }}
        run: node scripts/deployed-console-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-console-observations
          path: artifacts/deployed-console-boundary.json
          retention-days: 7
