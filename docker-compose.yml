# One Git-based Coolify Application; branch main, base /, Compose /docker-compose.yml.
# Route only web to container port 3006. Set the public origin explicitly.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mobicred_console
      POSTGRES_USER: mobicred
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - console-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    expose: ['3005']
    environment:
      NODE_ENV: production
      CONSOLE_ENV: production
      CONSOLE_PREVIEW_ENABLED: 'false'
      PORT: '3005'
      API_PREFIX: api/v1
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_NAME: mobicred_console
      DATABASE_USER: mobicred
      DATABASE_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      DATABASE_SSL: 'false'
      DATABASE_LOGGING: 'false'
      CORS_ORIGINS: ''
      CONSOLE_OIDC_ISSUER: ${CONSOLE_OIDC_ISSUER:?}
      CONSOLE_OIDC_CLIENT_ID: ${CONSOLE_OIDC_CLIENT_ID:-mobicred-console}
      CONSOLE_OIDC_CLIENT_SECRET: ${CONSOLE_OIDC_CLIENT_SECRET:?}
      CONSOLE_OIDC_AUDIENCE: ${CONSOLE_OIDC_AUDIENCE:-mobicred-console}
      CONSOLE_STAFF_ROLES: ${CONSOLE_STAFF_ROLES:?}
      CONSOLE_SESSION_ENCRYPTION_KEY: ${SERVICE_HEX_64_SESSION}
      CONSOLE_CASE_WORKFLOWS_ENABLED: ${CONSOLE_CASE_WORKFLOWS_ENABLED:-false}
      CONSOLE_CASE_WRITE_ROLES: ${CONSOLE_CASE_WRITE_ROLES:-}
      CONSOLE_AUDIT_READ_ROLES: ${CONSOLE_AUDIT_READ_ROLES:-}
      CONSOLE_CASE_REPORT_ROLES: ${CONSOLE_CASE_REPORT_ROLES:-}
      CONSOLE_CORE_URL: ${CONSOLE_CORE_URL:-}
      CONSOLE_CREDIT_READS_ENABLED: ${CONSOLE_CREDIT_READS_ENABLED:-false}
      CONSOLE_CREDIT_READ_ROLES: ${CONSOLE_CREDIT_READ_ROLES:-}
      CONSOLE_INGESTION_READS_ENABLED: ${CONSOLE_INGESTION_READS_ENABLED:-false}
      CONSOLE_INGESTION_READ_ROLES: ${CONSOLE_INGESTION_READ_ROLES:-}
      CONSOLE_CREDIT_URL: ${CONSOLE_CREDIT_URL:-}
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, /app/deploy/healthcheck.cjs, 'http://127.0.0.1:3005/api/v1/health/ready']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    expose: ['3006']
    environment:
      SERVICE_URL_WEB_3006: /
      NODE_ENV: production
      CONSOLE_ENV: production
      CONSOLE_PREVIEW_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      HOSTNAME: 0.0.0.0
      PORT: '3006'
      CONSOLE_PUBLIC_ORIGIN: ${CONSOLE_PUBLIC_ORIGIN:?}
      CONSOLE_API_URL: http://api:3005
      CONSOLE_API_TRANSPORT: compose
      CONSOLE_OIDC_ISSUER: ${CONSOLE_OIDC_ISSUER:?}
      CONSOLE_OIDC_CLIENT_ID: ${CONSOLE_OIDC_CLIENT_ID:-mobicred-console}
      CONSOLE_OIDC_CLIENT_SECRET: ${CONSOLE_OIDC_CLIENT_SECRET:?}
      CONSOLE_LOGIN_COOKIE_KEY: ${SERVICE_HEX_64_LOGIN}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/apps/web/.next/cache:rw,nosuid,size=64m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, /app/deploy/healthcheck.cjs, 'http://127.0.0.1:3006/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  console-postgres:
